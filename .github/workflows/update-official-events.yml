name: Update FF14 official events

on:
  push:
    paths:
      - ".github/workflows/update-official-events.yml"
      - "scripts/update-official-events.mjs"
      - "scripts/update-official-events.test.mjs"
      - "public/data/curated-official-events.json"
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-events
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test parser
        run: npm run test:official

      - name: Fetch official events
        run: npm run update:official

      - name: Commit updated data
        run: |
          if git diff --quiet -- public/data/official-events.json; then
            echo "No official event changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/official-events.json
          git commit -m "Update FF14 official events"
          git push
